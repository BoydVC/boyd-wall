<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Boyd Wall · Mission Control</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M32 10c7 6 10 15 10 25l-4 9H26l-4-9c0-10 3-19 10-25z' fill='%235eead4'/%3E%3Ccircle cx='32' cy='28' r='4' fill='%2305070d'/%3E%3Cpath d='M26 46h12l-6 10z' fill='%23fbbf24'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage">
  <header id="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 64 64"><path d="M32 6c8 7 11 17 11 28l-4 10H25l-4-10C21 23 24 13 32 6z" fill="currentColor"/><circle cx="32" cy="26" r="4.5" fill="#05070d"/><path d="M26 47h12l-6 11z" fill="var(--amber)"/></svg></div>
      <div><div class="brand-name">BOYD WALL</div><div class="brand-sub mono">MISSION CONTROL · MILLERSVILLE, MD</div></div>
    </div>
    <div class="clock">
      <div class="time"><span id="clkHM">--:--</span><span id="clkS" class="sec mono">:--</span><span id="clkAP" class="ap">--</span></div>
      <div id="clkDate" class="date">—</div>
    </div>
    <div class="today">
      <div class="label mono">TODAY</div>
      <div id="todayLine" class="today-line"></div>
    </div>
    <div id="wxNow" class="wxnow"></div>
  </header>

  <main id="grid">
    <section id="space" class="panel">
      <div class="panel-head">
        <div class="ph-title"><span class="dot cyan"></span>SPACEX · STARSHIP · STARLINK</div>
        <div id="spaceStatus" class="ph-status"></div>
      </div>
      <div id="hero" class="hero"></div>
      <div class="space-cols">
        <div class="col">
          <div class="sub-head mono">UP NEXT</div>
          <div id="upList" class="up-list"></div>
        </div>
        <div class="col">
          <div class="sub-head mono">STARSHIP PROGRAM</div>
          <div id="starship" class="starship"></div>
          <div class="sub-head mono" style="margin-top:14px">RECENT RESULTS</div>
          <div id="recent" class="recent"></div>
        </div>
      </div>
      <div id="wire" class="wire"></div>
    </section>

    <section id="sports" class="panel">
      <div class="panel-head">
        <div class="ph-title"><span class="dot amber"></span>SPORTS DESK</div>
        <div id="sportsStatus" class="ph-status"></div>
      </div>
      <div id="nextUp" class="next-up"></div>
      <div id="teamStage" class="team-stage"></div>
      <div id="teamDots" class="team-dots"></div>
    </section>

    <section id="weather" class="panel">
      <div class="panel-head">
        <div class="ph-title"><span class="dot sky"></span>WEATHER · WEEK AHEAD</div>
        <div id="wxStatus" class="ph-status"></div>
      </div>
      <div id="wxBody" class="wx-body"></div>
    </section>
  </main>

  <footer id="fleet">
    <div id="fuel" class="fuel"></div>
    <div class="ticker-wrap"><div id="ticker" class="ticker"></div></div>
    <div id="doctor" class="doctor"></div>
  </footer>

  <div id="ambient" aria-hidden="true">
    <div class="amb-inner">
      <div id="ambClock" class="amb-clock">--:--</div>
      <div id="ambDate" class="amb-date"></div>
      <div id="ambWx" class="amb-wx"></div>
      <div id="ambLines" class="amb-lines"></div>
    </div>
  </div>
  <div id="banner" class="banner"></div>
  <div id="hint" class="hint mono">A ambient · F fullscreen · R refresh · ←/→ teams</div>
</div>
<script src="app.js"></script>
</body>
</html>
